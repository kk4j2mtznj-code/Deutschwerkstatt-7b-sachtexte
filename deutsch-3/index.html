<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Wörterwerkstatt · Deutsch 3</title><style>*{box-sizing:border-box}body{margin:0;background:#181817;color:#fffaf1;font:18px/1.5 system-ui}main{max-width:820px;margin:auto;padding:clamp(18px,5vw,52px)}header{border-bottom:2px solid #ffad64;margin-bottom:22px}small{color:#ffb372;font-weight:bold}h1{font-size:clamp(35px,7vw,62px);letter-spacing:-.055em;margin:6px 0 22px}button,select,input,textarea{font:inherit;border-radius:9px;padding:9px 13px}button,select{cursor:pointer}button{border:1px solid #82776a;background:transparent;color:inherit}button[aria-pressed=true],.check{background:#ffb372;color:#231a14;border-color:#ffb372}nav{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}article{background:#fffaf0;color:#241f1b;border-radius:18px;padding:clamp(17px,4vw,34px)}h2{margin:0 0 10px}label{display:block;margin:16px 0}input,textarea{width:100%;border:1px solid #8a8178;background:white}textarea{min-height:180px}output{display:block;font-weight:650;color:#663510}details{margin:16px 0}select{max-width:100%}:focus-visible{outline:3px solid #4791e3}</style><main><header><small>DEUTSCH · KLASSE 3</small><h1>Wörterwerkstatt</h1></header><label>Übung wählen<br><select id="topic"></select></label><nav aria-label="Schwierigkeit"></nav><article id="work"></article></main><script>
const topics=['Verbformen','Wörter verlängern','i oder ie?','E-Mail schreiben','Exit-Ticket'];
const data=[
[['lesen: du …|liest','schlafen: ich …|schlafe','wissen: wir …|wissen'],['lesen: ihr …|lest','schlafen: du …|schläfst','wissen: er …|weiß'],['Opa … die Zeitung. (lesen)|liest','Was … du darüber? (wissen)|weißt','Wann … ihr ein? (schlafen)|schlaft']],
[['ein Hund – viele …|Hunde','rund – noch …|runder','sie klebt – wir …|kleben'],['Viele Berge. Ein …|Berg','Wir winken. Sie …|winkt','Noch lieber. Das Kind ist …|lieb'],['Das Seil ist star_. Schreibe das ganze Wort.|stark','Der Vogel flie_t. Schreibe das ganze Verb.|fliegt','Am Ufer steht ein Zel_. Schreibe das ganze Nomen.|Zelt']],
[['W_se|Wiese','K_ste|Kiste','B_ne|Biene'],['der St_ft|Stift','das T_r (ein Fuchs)|Tier','der P_nsel|Pinsel'],['Schreibe das falsche Wort richtig: Mia spilt draußen.|spielt','Schreibe das falsche Wort richtig: Ben trienkt Wasser.|trinkt','Trenne das Wort mit einem Strich in Silben: Briefe|Brie-fe']]
];
const hints=['Sprich das Verb mit dem passenden Personenwort.','Verlängere: viele Hunde, wir kleben, noch runder.','Sprich in Silben: Wie-se hat ein langes i, Kis-te ein kurzes i.'];
const mail=['Lade Mia zum Backen ein. Wann und wo trefft ihr euch?','Erzähle Opa von einem Ausflug. Was hast du dort erlebt?','Bitte Ben, nach deinem Turnbeutel zu schauen. Beschreibe ihn und sage, wo er liegen könnte.'];
let level=0, ticket=[], drafts={}; const menu=document.querySelector("nav"), panel=document.querySelector("article"), selector=document.querySelector("select");
topics.forEach(s=>selector.add(new Option(s)));selector.onchange=render;
function render(){let n=selector.selectedIndex;menu.replaceChildren();if(n<4)for(let i=0;i<3;i++){let b=document.createElement('button');b.textContent='★'.repeat(i+1);b.setAttribute('aria-label','Stufe '+(i+1));b.setAttribute('aria-pressed',i===level);b.onclick=()=>{level=i;render()};menu.append(b)}
panel.innerHTML='<h2>'+topics[n]+'</h2>';if(n===3){let name=['mia','opa','ben'][level];panel.innerHTML+='<p>'+mail[level]+'</p><p>Adresse: '+name+'@example.org</p><label>An<input id="addr"></label><label>Betreff<input id="sub"></label><label>Deine Nachricht<textarea id="msg"></textarea></label><details><summary>Meine E-Mail überprüfen</summary><p>Stimmen Adresse und Betreff? Beginnt die Nachricht mit einer Anrede? Hast du alle Fragen der Karte beantwortet? Stehen Gruß und Name am Ende?</p></details>';panel.querySelectorAll('input,textarea').forEach(el=>{let k=level+el.id;el.value=drafts[k]||'';el.oninput=()=>drafts[k]=el.value});return}
let qs=n===4?data.map(d=>d[Math.floor(Math.random()*3)][Math.floor(Math.random()*3)]):data[n][level];panel.innerHTML+='<p>'+(n===4?'Löse drei Aufgaben aus der Wörterwerkstatt.':n===2?'Schreibe das ganze Wort.':hints[n])+'</p>';qs.forEach((q,i)=>{let l=document.createElement('label');l.textContent=q.split('|')[0];let a=document.createElement('input');a.autocomplete='off';a.spellcheck=false;l.append(a,document.createElement('output'));panel.append(l)});let b=document.createElement('button');b.className='check';b.textContent='Antworten prüfen';let result=document.createElement('p');result.setAttribute('aria-live','polite');b.onclick=()=>{let score=0;panel.querySelectorAll('input').forEach((el,i)=>{let ans=qs[i].split('|')[1],v=el.value.trim();let ok=v===ans;score+=ok;el.nextElementSibling.textContent=ok?'✓ Richtig!':!v?'Hier fehlt noch dein Wort.':v.toLowerCase()===ans.toLowerCase()?'Achte auf den Anfangsbuchstaben.':'Versuche es noch einmal. '+hints[n===4?i:n]});result.textContent=score+' von 3 richtig.'};panel.append(b,result);if(n===4){let again=document.createElement('button');again.textContent='Neues Ticket';again.onclick=render;panel.append(again)}else{let d=document.createElement('details');d.innerHTML='<summary>Lösungen vergleichen</summary><p>'+qs.map(q=>q.split('|')[1]).join(' · ')+'</p>';panel.append(d)}}
render()</script></html>
